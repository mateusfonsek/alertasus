name: alertasus

services:
  # ----- Infraestrutura -----
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: alertasus-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: alertasus
      RABBITMQ_DEFAULT_PASS: alertasus
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alertasus-net

  postgres:
    image: postgres:16-alpine
    container_name: alertasus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: alertasus
      POSTGRES_PASSWORD: alertasus
      POSTGRES_DB: alertasus
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertasus -d alertasus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alertasus-net

  redis:
    image: redis:7-alpine
    container_name: alertasus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alertasus-net

  # ----- Serviços de aplicação -----
  ingestion:
    build: ./services/ingestion
    container_name: alertasus-ingestion
    ports:
      - "8001:8000"
    environment:
      RABBITMQ_URL: amqp://alertasus:alertasus@rabbitmq:5672/
      SERVICE_NAME: ingestion
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - alertasus-net

  aggregation:
    build: ./services/aggregation
    container_name: alertasus-aggregation
    ports:
      - "8002:8000"
    environment:
      RABBITMQ_URL: amqp://alertasus:alertasus@rabbitmq:5672/
      DATABASE_URL: postgresql://alertasus:alertasus@postgres:5432/alertasus
      SERVICE_NAME: aggregation
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - alertasus-net

  alerts:
    build: ./services/alerts
    container_name: alertasus-alerts
    ports:
      - "8003:8000"
    environment:
      RABBITMQ_URL: amqp://alertasus:alertasus@rabbitmq:5672/
      DATABASE_URL: postgresql://alertasus:alertasus@postgres:5432/alertasus
      SERVICE_NAME: alerts
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - alertasus-net

  query:
    build: ./services/query
    container_name: alertasus-query
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://alertasus:alertasus@postgres:5432/alertasus
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: query
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alertasus-net

volumes:
  pg_data:

networks:
  alertasus-net:
    driver: bridge