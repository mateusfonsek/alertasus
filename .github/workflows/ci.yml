name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  services:
    name: Lint & Test (${{ matrix.componente }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente:
          - services/ingestion
          - services/aggregation
          - services/alerts
          - services/query
          - simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.componente }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.componente }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: ${{ matrix.componente }}
        run: ruff check .

      - name: Test (pytest)
        working-directory: ${{ matrix.componente }}
        run: pytest -q

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q
